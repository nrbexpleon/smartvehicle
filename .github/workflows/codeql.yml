name: codeql
on:
  push:
    branches: [main, feature/sdv-platform-foundation]
  pull_request:
    branches: [main]
  schedule:
    - cron: '17 3 * * 1'
permissions:
  contents: read
  security-events: write
  packages: read
jobs:
  analyze:
    name: CodeQL C++
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          queries: security-extended
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug -j2
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:c-cpp
