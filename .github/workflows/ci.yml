name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Install host adapter dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libssl-dev
      - name: Validate configuration and architecture
        run: |
          python3 tools/config_validator/validate.py config/profiles/*.json
          python3 tools/dependency_checker/check.py .
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        shell: bash
        run: |
          if ! cmake --build --preset host-debug -j2 > build/build.log 2>&1; then
            grep -E "(error:|undefined reference)" build/build.log | head -50 | while IFS= read -r line; do echo "::error::$line"; done
            cat build/build.log
            exit 1
          fi
      - name: Test
        run: ctest --preset host-debug
      - name: Run examples
        run: |
          ./build/vehicle_status config/profiles/host-simulation.json
          ./build/ota_simulation
      - name: Generate SBOM and package
        run: |
          python3 tools/sbom/generate.py
          cd build && cpack -G TGZ
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smartvehicle-host-artifacts
          path: |
            build/build.log
            build/sbom.cdx.json
            build/*.tar.gz
